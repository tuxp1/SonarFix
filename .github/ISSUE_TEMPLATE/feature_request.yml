name: Feature request
description: Suggest an improvement to SonarFix.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        SonarFix aims to stay small and focused on SteelSeries Sonar and Discord audio problems.
        Requests that fit that scope are the most likely to be accepted.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation, not only the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like SonarFix to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you have tried
    validations:
      required: false
